<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2e9">
<title>マーパンと記念撮影 · LifeSketch 020</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<a class="home" href="../">LIFESketch <span>/ 020</span></a>
<h1>マーパンと記念撮影</h1>
<section class="photo-area" aria-label="写真の編集">
<p id="empty">好きな風景に、マーパンを。<br>写真を選んではじめる。</p>
<canvas id="photo" hidden tabindex="0" aria-label="マーパンをタップで選択。写真のどこからでもドラッグで移動、2本指で拡大縮小と回転。矢印キーでも移動できます。"></canvas>
</section>
<p class="hint">タップで選ぶ · 写真のどこからでもドラッグで移動<br>2本指で拡大縮小・回転</p>
<div class="buttons"><label class="button" for="file">写真を選ぶ</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><label class="button" for="camera">カメラで撮る</label><input id="camera" type="file" accept="image/*" capture="environment"><button id="save" disabled>画像を保存</button></div>
<fieldset id="controls" disabled>
<button id="add" type="button">マーパンを追加</button><button id="remove" type="button">選んだマーパンを削除</button>
<label for="selected">選択中</label><select id="selected" aria-label="編集するマーパン"></select>
<label for="size">大きさ <output id="size-value">100%</output></label><input id="size" type="range" min="20" max="250" value="100">
<label for="angle">角度 <output id="angle-value">0°</output></label><input id="angle" type="range" min="-180" max="180" value="0">
<button id="reset" type="button">選んだ配置を戻す</button>
</fieldset>
<p id="status" role="status" aria-live="polite"></p>
<p class="privacy">写真はこのブラウザの中だけで使います。</p>
<section id="result" hidden aria-label="保存する画像"><p>画像を長押しして保存することもできます。</p><img id="result-image" alt="マーパンと記念撮影した完成画像"><div class="buttons"><a id="download" class="button" download="lifesketch-marpan.png">ダウンロード</a><button id="share" hidden>共有して保存</button><button id="close-result">閉じる</button></div></section>
<div id="renderer" hidden></div>
</main>
<script src="../002_jomon-room/p5.min.js"></script>
<script src="../shared/marpan-25d.js"></script>
<script src="sketch.js"></script>
</body>
</html>
