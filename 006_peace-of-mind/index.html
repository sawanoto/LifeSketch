<main>
  <div class="title"><p>LIFE SKETCH — 006</p><h1>免罪符と生命保険</h1></div>
  <section class="diptych" aria-label="過去と未来、それぞれの安心を買う">
    <div class="headings"><h2><small>PAST</small>過去の安心</h2><h2><small>FUTURE</small>未来の安心</h2></div>
    <div id="scene" role="img" aria-label="教会と都市。同じ姿の三つ目のマーパンの上に、過去と未来の黒い雲が浮かぶ。"></div>
    <div class="purchases">
      <div><button class="document parchment" id="past" aria-label="免罪符を買う">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5v29M10 15h20"/></svg>
        <strong>免罪符</strong><span class="script" aria-hidden="true">✧ ───── ✧<br>── ───── ──<br>──── ────</span>
        <span class="buy">1枚のコインで買う</span>
      </button></div>
      <div><button class="document contract" id="future" aria-label="生命保険を買う">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5l12 5v10c0 8-12 15-12 15S8 28 8 20V10z"/><path d="m14 19 4 4 8-9"/></svg>
        <strong>生命保険</strong><span class="script" aria-hidden="true">───────<br>──── ────<br>───────</span>
        <span class="buy">1枚のコインで買う</span>
      </button></div>
    </div>
    <p id="revelation" role="status">買ったのは、安心。</p>
  </section>
  <footer><p>書類にふれて、もう一度。</p><button id="reset">はじめから</button></footer>
