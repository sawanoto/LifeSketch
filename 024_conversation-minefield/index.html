<button type="button" data-vowel="3" aria-label="え（E）"><span>え</span><small>E</small></button>
<button type="button" data-vowel="4" aria-label="お（O）"><span>お</span><small>O</small></button>
</div>
<p id="hint" role="status">鍵盤をタップ / A・I・U・E・O</p>
</main>
